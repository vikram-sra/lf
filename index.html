<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lady Friend | Cycle Tracker</title>
    <meta name="description" content="A premium, biophilic menstrual cycle tracker.">
    <meta name="theme-color" content="#fef9f2">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="premium-effects.css">
</head>

<body>
    <!-- SVG Blue Lake Water Background -->
    <div id="svg-water-container" aria-hidden="true">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="water-svg">
            <g class="water-waves">
                <path class="wave wave-1" d="M-5,45 C20,35 40,55 70,45 C90,35 105,45 105,45 L105,105 L-5,105 Z"
                    fill="rgba(61,165,217,0.12)" />
                <path class="wave wave-2" d="M-5,50 C25,60 55,30 85,50 C100,60 105,50 105,50 L105,105 L-5,105 Z"
                    fill="rgba(0,180,216,0.08)" />
                <path class="wave wave-3" d="M-5,35 C30,25 60,45 90,35 C100,30 105,35 105,35 L105,105 L-5,105 Z"
                    fill="rgba(126,200,227,0.06)" />

                <path class="wave wave-4" d="M-5,65 C15,55 35,75 60,65 C85,55 105,65 105,65 L105,105 L-5,105 Z"
                    fill="rgba(61,165,217,0.1)" />
                <path class="wave wave-5" d="M-5,70 C30,80 70,50 105,70 L105,105 L-5,105 Z"
                    fill="rgba(0,180,216,0.12)" />

                <path class="wave wave-6" d="M-5,85 C20,75 50,95 80,85 C95,80 105,85 105,85 L105,105 L-5,105 Z"
                    fill="rgba(126,200,227,0.08)" />
            </g>
        </svg>
    </div>

    <div class="sacred-grid" aria-hidden="true"></div>
    <div id="ambient-overlay" aria-hidden="true"></div>
    <div id="toast-container" aria-hidden="true"></div>

    <svg width="0" height="0" aria-hidden="true" style="position: absolute; pointer-events: none;">
        <defs>
            <filter id="crystal-refraction" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
                <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1" specularExponent="20"
                    lighting-color="#fffbe6" result="spec">
                    <feDistantLight azimuth="45" elevation="45" />
                </feSpecularLighting>
                <feComposite in="spec" in2="SourceAlpha" operator="in" result="lit" />
                <feMerge>
                    <feMergeNode in="SourceGraphic" />
                    <feMergeNode in="lit" />
                </feMerge>
            </filter>

            <radialGradient id="sun-crystal-gradient">
                <stop offset="0%" stop-color="#fffbe6" />
                <stop offset="30%" stop-color="#fff5cc" />
                <stop offset="60%" stop-color="#ffd166" />
                <stop offset="100%" stop-color="#e8b530" />
            </radialGradient>

            <!-- Layer 4: outermost, ethereal -->
            <radialGradient id="petal-layer4-gradient" cx="50%" cy="20%" r="80%">
                <stop offset="0%" stop-color="rgba(255,240,200,0.35)" />
                <stop offset="50%" stop-color="rgba(124,212,168,0.12)" />
                <stop offset="100%" stop-color="rgba(184,169,212,0.06)" />
            </radialGradient>

            <!-- Layer 3: large, warm -->
            <radialGradient id="petal-layer3-gradient" cx="50%" cy="25%" r="75%">
                <stop offset="0%" stop-color="rgba(255,245,205,0.50)" />
                <stop offset="40%" stop-color="rgba(255,209,102,0.22)" />
                <stop offset="100%" stop-color="rgba(232,131,124,0.08)" />
            </radialGradient>

            <!-- Outer ring: standard -->
            <radialGradient id="petal-aura-gradient" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="rgba(255,251,230,0.65)" />
                <stop offset="100%" stop-color="rgba(255,209,102,0.30)" />
            </radialGradient>

            <!-- Mid ring: warm glow -->
            <radialGradient id="petal-mid-gradient" cx="50%" cy="30%" r="65%">
                <stop offset="0%" stop-color="rgba(255,248,220,0.72)" />
                <stop offset="50%" stop-color="rgba(232,197,71,0.35)" />
                <stop offset="100%" stop-color="rgba(212,160,23,0.12)" />
            </radialGradient>
        </defs>
    </svg>

    <div id="app">
        <header class="app-header">
            <div class="top-divider"></div>
            <p id="phase-subtitle">Daily Insights &amp; Guidance</p>
        </header>

        <main class="app-main">
            <section id="scroll-nourishment" class="scroll-tab" data-scroll="nourishment" aria-hidden="true">
                <div class="scroll-content" role="dialog" aria-modal="true" aria-label="Nourishment">
                    <button class="scroll-close-btn" type="button" aria-label="Close nourishment">&times;</button>
                    <div class="scroll-inner-content">
                        <h3>Nourishment</h3>
                        <div id="nourishment-content"></div>
                    </div>
                </div>
            </section>

            <section class="dial-stage">
                <div class="lotus-container">
                    <svg id="lotus-dial" viewBox="0 0 400 400" role="img" aria-label="Cycle dial">
                        <g id="outer-petals-group"></g>
                        <g id="mid-petals-group"></g>
                        <g id="inner-petals-group"></g>

                        <g id="sun-core-group" tabindex="0" role="button" aria-label="Open daily log">
                            <circle id="sun-center" cx="200" cy="200" r="82" fill="url(#sun-crystal-gradient)"
                                filter="url(#crystal-refraction)" />

                            <g id="sun-info-standard">
                                <text x="200" y="165" text-anchor="middle" dominant-baseline="middle" class="sun-label">Cycle</text>
                                <text x="200" y="175" text-anchor="middle" dominant-baseline="middle" class="sun-label">Day</text>
                                <text id="date-day" x="200" y="210" text-anchor="middle" dominant-baseline="middle" class="sun-day">01</text>
                                <text id="date-phase" x="200" y="238" text-anchor="middle" dominant-baseline="middle" class="sun-phase">MENSTRUAL</text>
                            </g>

                            <g id="sun-info-insight" class="sun-insight-group" aria-hidden="true">
                                <foreignObject x="122" y="255" width="156" height="64">
                                    <div xmlns="http://www.w3.org/1999/xhtml" class="insight-wrap">
                                        <p id="daily-insight-text">Loading insight...</p>
                                    </div>
                                </foreignObject>
                            </g>
                        </g>
                    </svg>
                </div>

                <div class="center-action-buttons">
                    <button id="action-nourish" class="fast-action-btn nourish" type="button">
                        <span class="btn-glow"></span>
                        <span class="btn-icon" aria-hidden="true">🍃</span>
                        <span class="btn-text">Nourish</span>
                    </button>
                    <button id="action-exercise" class="fast-action-btn exercise" type="button">
                        <span class="btn-glow"></span>
                        <span class="btn-icon" aria-hidden="true">🧘</span>
                        <span class="btn-text">Asanas</span>
                    </button>
                </div>
            </section>

            <section id="scroll-asanas" class="scroll-tab" data-scroll="asanas" aria-hidden="true">
                <div class="scroll-content" role="dialog" aria-modal="true" aria-label="Asanas">
                    <button class="scroll-close-btn" type="button" aria-label="Close asanas">&times;</button>
                    <div class="scroll-inner-content">
                        <h3>Asanas</h3>
                        <div id="asanas-content"></div>
                    </div>
                </div>
            </section>
        </main>

        <nav id="nav-leaves" aria-label="Primary">
            <button id="nav-history" class="nav-leaf" aria-label="History" type="button">
                <svg viewBox="0 0 80 100" aria-hidden="true">
                    <path d="M40 5 Q10 30 10 60 Q10 95 40 95 Q70 95 70 60 Q70 30 40 5" fill="rgba(124,212,168,0.35)"
                        stroke="#ffffff" stroke-width="0.8" />
                    <path
                        d="M40 90 L40 15 M40 80 Q25 75 15 60 M40 80 Q55 75 65 60 M40 55 Q20 50 15 35 M40 55 Q60 50 65 35"
                        stroke="#ffffff" stroke-width="0.5" opacity="0.6" fill="none" />
                </svg>
                <span class="nav-label">History</span>
            </button>

            <button id="nav-log" class="nav-leaf nav-core" aria-label="Log entry" type="button">
                <span class="core-circle">
                    <svg class="mini-lotus" viewBox="0 0 40 40" width="32" height="32" aria-hidden="true" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3)); overflow: visible;">
                        <g transform="translate(20,20)">
                            <g class="mini-lotus-spin">
                                <path d="M0,-14 C4,-10 4,-4 0,0 C-4,-4 -4,-10 0,-14Z" fill="rgba(232,131,124,1.0)" stroke="#fff" stroke-width="0.5"/>
                                <path d="M0,-14 C4,-10 4,-4 0,0 C-4,-4 -4,-10 0,-14Z" fill="rgba(64,162,118,1.0)" stroke="#fff" stroke-width="0.5"
                                    transform="rotate(60)" />
                                <path d="M0,-14 C4,-10 4,-4 0,0 C-4,-4 -4,-10 0,-14Z" fill="rgba(225,159,52,1.0)" stroke="#fff" stroke-width="0.5"
                                    transform="rotate(120)" />
                                <path d="M0,-14 C4,-10 4,-4 0,0 C-4,-4 -4,-10 0,-14Z" fill="rgba(144,129,182,1.0)" stroke="#fff" stroke-width="0.5"
                                    transform="rotate(180)" />
                                <path d="M0,-14 C4,-10 4,-4 0,0 C-4,-4 -4,-10 0,-14Z" fill="rgba(227,147,108,1.0)" stroke="#fff" stroke-width="0.5"
                                    transform="rotate(240)" />
                                <path d="M0,-14 C4,-10 4,-4 0,0 C-4,-4 -4,-10 0,-14Z" fill="rgba(66,150,187,1.0)" stroke="#fff" stroke-width="0.5"
                                    transform="rotate(300)" />
                            </g>
                            <circle cx="0" cy="0" r="3.5" fill="#e8b530" stroke="#fff" stroke-width="1" />
                        </g>
                    </svg>
                </span>
                <span class="nav-label">Log</span>
            </button>

            <button id="nav-rituals" class="nav-leaf" aria-label="Rituals" type="button">
                <svg viewBox="0 0 80 100" aria-hidden="true">
                    <path d="M40 5 Q10 30 10 60 Q10 95 40 95 Q70 95 70 60 Q70 30 40 5" fill="rgba(184,169,212,0.35)"
                        stroke="#ffffff" stroke-width="0.8" />
                    <path
                        d="M40 90 L40 15 M40 80 Q25 75 15 60 M40 80 Q55 75 65 60 M40 55 Q20 50 15 35 M40 55 Q60 50 65 35"
                        stroke="#ffffff" stroke-width="0.5" opacity="0.6" fill="none" />
                </svg>
                <span class="nav-label">Rituals</span>
            </button>
        </nav>
    </div>

    <div id="log-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="log-title"
        aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content parchment-scroll" tabindex="-1">
            <button id="close-log-modal" class="modal-close" type="button" aria-label="Close log"></button>
            <h2 id="log-title">Daily Log</h2>
            <div id="log-body"></div>
            <button id="save-log" type="button" class="primary-btn">Record Entry</button>
        </div>
    </div>

    <div id="history-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="history-title"
        aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content parchment-scroll" tabindex="-1">
            <button id="close-history-modal" class="modal-close" type="button" aria-label="Close history"></button>
            <h2 id="history-title">History &amp; Insights</h2>
            <div class="data-actions">
                <button id="export-json" type="button" class="ghost-btn">Export JSON</button>
                <button id="export-csv" type="button" class="ghost-btn">Export CSV</button>
                <button id="import-data" type="button" class="ghost-btn">Import</button>
                <button id="reset-data" type="button" class="ghost-btn danger">Reset</button>
                <input id="import-file" type="file" accept="application/json,.csv" class="hidden-input">
            </div>
            <div id="history-body"></div>
            <div class="settings-section">
                <h3
                    style="font-family: 'Cormorant Garamond', serif; color: #8B6914; font-size: 1.3rem; margin-bottom: 0.6rem;">
                    ⚙️ Cycle Settings</h3>
                <div class="settings-grid" id="settings-grid"></div>
                <button id="save-settings" type="button" class="primary-btn"
                    style="background: linear-gradient(135deg, #e8c547, #d4a017);">Save Settings</button>
            </div>
        </div>
    </div>

    <div id="scroll-rituals" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rituals-title"
        aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content parchment-scroll" tabindex="-1">
            <button id="close-rituals-modal" class="modal-close" type="button" aria-label="Close rituals"></button>
            <h2 id="rituals-title">Self-Care Rituals</h2>
            <div id="rituals-content"></div>
        </div>
    </div>

    <script src="https://unpkg.com/zustand@4.4.7/umd/zustand.production.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="data.js"></script>
    <script src="store.js"></script>
    <script src="toast.js"></script>
    <script src="lotus-dial.js"></script>
    <script src="scroll-system.js"></script>
    <script src="modals.js"></script>
    <script src="premium-effects.js"></script>
    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => { });
            });
        }
    </script>
</body>

</html>
